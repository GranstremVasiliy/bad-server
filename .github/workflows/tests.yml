name: Tests

on:
  push:
    branches:
      - "**"
    tags:
      - "**"

env:
  DIR_TESTS: /tmp/tests-bad-server
  REP_TESTS: https://github.com/Yandex-Practicum/tests-bad-server.git
  REPO: ${{ github.event.repository.name }}
  COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Set up GitHub Actions
        uses: actions/checkout@v4

      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Get testing lib
        run: set -eu && git clone --depth 1 $REP_TESTS $DIR_TESTS

      - name: Prepare CSRF secret for CI
        shell: bash
        run: |
          set -eu
          CSRF_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$CSRF_SECRET"
          printf 'services:\n  backend:\n    environment:\n      CSRF_SECRET: "%s"\n' \
            "$CSRF_SECRET" > docker-compose.ci.yml

      - name: Start project
        run: bash $DIR_TESTS/bin/start_project.sh

      - name: Run tests
        run: bash $DIR_TESTS/bin/run.sh

      - name: Show container diagnostics
        if: always()
        run: docker compose ps -a
          docker compose logs --no-color --tail=200 backend server

          echo "=== CSRF through nginx ==="
          curl --silent --show-error --max-time 10 \
          --dump-header - --output /dev/null \
          http://localhost/api/auth/csrf-token || true

          echo "=== CSRF directly from backend ==="
          curl --silent --show-error --max-time 10 \
          --dump-header - --output /dev/null \
          http://localhost:3000/auth/csrf-token || true

          echo "=== Cookie name inside backend container ==="
          docker compose exec -T backend \
          grep -n CSRF_COOKIE_NAME /app/src/middlewares/csrf.ts || true
